name: Supabase Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan for leaked Supabase keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Supabase secret scan
        run: |
          chmod +x scripts/scan.sh
          bash scripts/scan.sh .

      - name: Comment on PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Supabase secret scan failed.** A possible leaked key was detected in this PR. Remove it, rotate the key in the Supabase dashboard, and store secrets via GitHub Secrets / env vars. See the workflow logs for details.'
            })
